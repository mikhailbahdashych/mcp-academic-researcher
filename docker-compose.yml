services:
  backend:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    volumes:
      - app_data:/app/data
    environment:
      DATABASE_URL: "file:/app/data/app.db"
      ORCHESTRATOR_URL: "http://localhost:8000"
      PORT: "3000"
      CORS_ORIGIN: "http://localhost"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  app_data:
