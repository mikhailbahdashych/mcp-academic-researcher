<div class="search-hero">
  <div class="hero-badge">
    <span class="badge-dot"></span>
    AI-Powered Academic Research
  </div>

  <h1 class="hero-title">
    Explore the
    <span class="hero-accent">scientific literature</span>
    instantly
  </h1>

  <p class="hero-subtitle">
    Ask any research question and get AI-synthesized answers with citations from
    peer-reviewed papers.
  </p>

  <div class="hero-input">
    <app-query-input
      size="hero"
      (querySubmit)="querySubmit.emit($event)"
    ></app-query-input>
  </div>

  <p class="hint text-secondary">
    Press <kbd>&#8984;K</kbd> anytime to focus · <kbd>Enter</kbd> to submit
  </p>
</div>
