<article class="note-card">
  <div class="note-head">
    <h3 class="note-title">{{ note.title }}</h3>
    @if (note.score != null) {
      <span class="score-badge mono" matTooltip="Semantic similarity">
        {{ scorePercent(note.score) }}
      </span>
    }
    <button
      type="button"
      class="icon-action delete-btn"
      matTooltip="Delete note"
      aria-label="Delete note"
      (click)="onDelete($event)"
    >
      <span class="material-icons">delete_outline</span>
    </button>
  </div>

  <p class="note-content" [class.clamped]="!expanded()">{{ note.content }}</p>

  @if (note.content.length > 200) {
    <button type="button" class="icon-action expand-btn" (click)="toggleExpand()">
      <span class="material-icons">{{ expanded() ? 'expand_less' : 'expand_more' }}</span>
      {{ expanded() ? 'Show less' : 'Show more' }}
    </button>
  }

  <div class="note-footer">
    @for (paperId of paperIds; track paperId) {
      <button
        type="button"
        class="paper-badge mono truncate"
        matTooltip="Click to copy"
        (click)="copyDoi(paperId, $event)"
      >
        {{ paperId }}
      </button>
    }
    <span class="note-date mono">{{ formatDate(note.created_at) }}</span>
    @for (tag of note.tags; track tag) {
      <span class="tag-pill mono">{{ tag }}</span>
    }
  </div>
</article>
