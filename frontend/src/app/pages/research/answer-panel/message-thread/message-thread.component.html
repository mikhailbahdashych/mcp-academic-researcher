<div class="message-thread">
  @for (message of messages; track message.id) {
    <app-message-bubble
      [message]="message"
      [maxCitations]="maxCitations"
      [disableRewrite]="isStreaming"
      (saveNote)="saveNote.emit($event)"
      (rewrite)="rewrite.emit($event)"
    ></app-message-bubble>
  }
  <div #scrollAnchor class="scroll-anchor"></div>
</div>
