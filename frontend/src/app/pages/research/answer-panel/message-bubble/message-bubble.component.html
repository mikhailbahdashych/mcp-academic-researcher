<div class="turn" [class.user]="message.role === 'user'" [class.assistant]="message.role === 'assistant'">
  @if (message.role === 'user') {
    <div class="user-bubble">{{ message.content }}</div>
  } @else {
    <div class="assistant-row">
      <span class="assistant-avatar" aria-hidden="true">
        <span class="material-icons">auto_awesome</span>
      </span>
      <div class="assistant-body">
        @if (message.content) {
          <app-markdown-viewer
            [content]="message.content"
            [maxCitations]="maxCitations"
          ></app-markdown-viewer>
        }
        @if (message.isStreaming) {
          <app-streaming-cursor></app-streaming-cursor>
        }
        @if (!message.content && message.isStreaming) {
          <span class="thinking text-faint">Thinking&hellip;</span>
        }
        @if (!message.isStreaming && message.content) {
          <div class="answer-actions">
            <button type="button" class="icon-action" (click)="copy()">
              <span class="material-icons">content_copy</span>Copy
            </button>
            <button type="button" class="icon-action" (click)="saveNote.emit(message)">
              <span class="material-icons">bookmark_add</span>Save note
            </button>
            <button
              type="button"
              class="icon-action"
              [disabled]="disableRewrite"
              (click)="rewrite.emit(message)"
            >
              <span class="material-icons">refresh</span>Rewrite
            </button>
          </div>
        }
      </div>
    </div>
  }
</div>
