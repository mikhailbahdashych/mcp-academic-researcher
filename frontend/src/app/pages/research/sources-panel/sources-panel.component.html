<aside class="sources-rail">
  <div class="rail-header">
    <span class="rail-title">Sources</span>
    @if (papers().length) {
      <span class="rail-count mono">{{ papers().length }}</span>
    }
  </div>

  <div class="rail-body">
    @if (isStreaming() && !papers().length) {
      @for (i of [1, 2, 3]; track i) {
        <div class="skeleton-row"></div>
      }
    }

    @if (!isStreaming() && !papers().length) {
      <div class="empty">
        <span class="material-icons">article</span>
        <p class="text-faint">Sources will appear here as the AI responds.</p>
      </div>
    }

    @for (paper of papers(); track paper.id; let i = $index) {
      <app-paper-card
        [attr.id]="'source-' + (i + 1)"
        [paper]="paper"
        [index]="i"
        [expanded]="expandedId() === paper.id"
        [highlighted]="highlightedIndex() === i + 1"
        (toggle)="toggleExpanded(paper.id)"
        (citationLookup)="citationLookup.emit($event)"
      ></app-paper-card>
    }
  </div>
</aside>
