<mat-card class="session-card" [routerLink]="['/research', session.id]">
  <mat-card-content>
    <p class="session-title truncate">{{ session.title }}</p>
    <div class="session-meta text-secondary">
      <span class="meta-item">
        <mat-icon>chat_bubble_outline</mat-icon>
        {{ messageCount }} messages
      </span>
      @if (session.papers.length) {
        <span class="meta-item">
          <mat-icon>article</mat-icon>
          {{ session.papers.length }} sources
        </span>
      }
      <span class="meta-item">
        <mat-icon>schedule</mat-icon>
        {{ formattedDate }}
      </span>
    </div>
  </mat-card-content>
  <mat-card-actions>
    <button
      mat-icon-button
      class="delete-btn"
      [disabled]="isStreaming()"
      [matTooltip]="isStreaming() ? 'Cannot delete while responding' : 'Delete'"
      (click)="$event.preventDefault(); $event.stopPropagation(); !isStreaming() && delete.emit(session.id)"
    >
      <mat-icon>delete_outline</mat-icon>
    </button>
  </mat-card-actions>
</mat-card>
