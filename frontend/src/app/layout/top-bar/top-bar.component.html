<header class="top-bar">
  <button type="button" class="icon-btn" (click)="menuClick.emit()" aria-label="Toggle menu">
    <span class="material-icons">menu</span>
  </button>

  <a class="app-title" routerLink="/">
    <span class="material-icons title-icon">science</span>
    <span>MCP Researcher</span>
  </a>

  <button
    type="button"
    class="icon-btn theme-btn"
    (click)="themeService.toggle()"
    [attr.aria-label]="themeService.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
  >
    <span class="material-icons">{{ themeService.isDark() ? 'dark_mode' : 'light_mode' }}</span>
  </button>
</header>
