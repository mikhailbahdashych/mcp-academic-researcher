<div class="session-list">
  <p class="mono-label">Library</p>

  @if (!sessions().length) {
    <p class="empty text-faint">No threads yet</p>
  }

  @for (session of sessions(); track session.id) {
    <app-session-item
      [session]="session"
      (deleteSession)="onDelete($event)"
    ></app-session-item>
  }
</div>
