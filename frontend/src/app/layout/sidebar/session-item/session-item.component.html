<a
  class="session-item"
  [routerLink]="['/research', session.id]"
  routerLinkActive="active"
>
  <mat-icon class="session-icon">chat</mat-icon>
  <span class="session-title truncate">{{ session.title }}</span>
  <button
    mat-icon-button
    class="delete-btn"
    (click)="$event.preventDefault(); $event.stopPropagation(); deleteSession.emit(session.id)"
    matTooltip="Delete"
  >
    <mat-icon>close</mat-icon>
  </button>
</a>
