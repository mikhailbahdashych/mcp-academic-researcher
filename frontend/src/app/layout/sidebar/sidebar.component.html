<div class="sidebar" [class.collapsed]="collapsed">
  <app-sidebar-header [collapsed]="collapsed"></app-sidebar-header>

  <nav class="sidebar-nav">
    <a
      class="nav-item"
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="closeSidenav.emit()"
      [matTooltip]="collapsed ? 'New thread' : ''"
      matTooltipPosition="right"
    >
      <span class="material-icons">add</span>
      @if (!collapsed) {
        <span class="label">New thread</span>
        <span class="kbd mono">&#8984;K</span>
      }
    </a>
    <a
      class="nav-item"
      routerLink="/history"
      routerLinkActive="active"
      (click)="closeSidenav.emit()"
      [matTooltip]="collapsed ? 'History' : ''"
      matTooltipPosition="right"
    >
      <span class="material-icons">history</span>
      @if (!collapsed) { <span class="label">History</span> }
    </a>
    <a
      class="nav-item"
      routerLink="/notes"
      routerLinkActive="active"
      (click)="closeSidenav.emit()"
      [matTooltip]="collapsed ? 'Notes' : ''"
      matTooltipPosition="right"
    >
      <span class="material-icons">sticky_note_2</span>
      @if (!collapsed) { <span class="label">Notes</span> }
    </a>
    <a
      class="nav-item"
      routerLink="/settings"
      routerLinkActive="active"
      (click)="closeSidenav.emit()"
      [matTooltip]="collapsed ? 'Settings' : ''"
      matTooltipPosition="right"
    >
      <span class="material-icons">tune</span>
      @if (!collapsed) { <span class="label">Settings</span> }
    </a>
  </nav>

  @if (!collapsed) {
    <app-session-list class="session-list-host"></app-session-list>
  }

  <app-sidebar-footer
    [collapsed]="collapsed"
    (toggleCollapse)="toggleCollapse.emit()"
  ></app-sidebar-footer>
</div>
