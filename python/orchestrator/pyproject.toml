[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orchestrator"
version = "0.1.0"
description = "FastAPI orchestrator for MCP Academic Researcher"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.128.0",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "uvicorn>=0.40.0",
    "ollama>=0.4.0",
    "mcp>=1.25.0,<2",  # 2.0 removed mcp.server.fastmcp
    "python-dotenv>=1.0.0",
    "shared",
    "anthropic>=1.0.0",
]

[tool.uv.sources]
shared = { workspace = true }

[project.scripts]
orchestrator = "orchestrator.main:start"
