[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-citations"
version = "0.1.0"
description = "Citations MCP server"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.25.0",
    "pydantic>=2.12.5",
    "httpx>=0.28.1",
]

[project.scripts]
mcp-citations = "citations.server:main"

[tool.hatch.build.targets.wheel]
packages = ["citations"]
