[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-papers"
version = "0.1.0"
description = "Papers search MCP server"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.25.0,<2",  # 2.0 removed mcp.server.fastmcp
    "pydantic>=2.12.5",
    "httpx>=0.28.1",
]

[project.scripts]
mcp-papers = "papers.server:main"

[tool.hatch.build.targets.wheel]
packages = ["papers"]
