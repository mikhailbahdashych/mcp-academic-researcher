[project]
name = "mcp-notes"
version = "0.1.0"
description = "Notes management MCP server"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.25.0,<2",  # 2.0 removed mcp.server.fastmcp
    "pydantic>=2.12.5",
    "sqlite-vec>=0.1.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["notes"]

[project.scripts]
mcp-notes = "notes.server:main"
